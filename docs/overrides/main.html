{% extends "base.html" %}

{% block content %}
  {{ super() }}

  {% if config.extra.giscus %}
    <section class="giscus-wrap">
      <h2 id="__comments">批注与讨论</h2>
      <p class="giscus-hint">
        这一栏直接存在 GitHub Discussions 里，<strong>提交后立刻显示</strong>，不需要重新发布站点。
        想改正文里那个 <code>📝 我的批注</code> 框，用右上角的铅笔按钮。
      </p>
      <script
        src="https://giscus.app/client.js"
        data-repo="{{ config.extra.giscus.repo }}"
        data-repo-id="{{ config.extra.giscus.repo_id }}"
        data-category="{{ config.extra.giscus.category }}"
        data-category-id="{{ config.extra.giscus.category_id }}"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
      </script>
      <script>
        (function () {
          var sync = function () {
            var frame = document.querySelector("iframe.giscus-frame");
            if (!frame) return;
            var dark = document.body.getAttribute("data-md-color-scheme") === "slate";
            frame.contentWindow.postMessage(
              { giscus: { setConfig: { theme: dark ? "dark" : "light" } } },
              "https://giscus.app"
            );
          };
          new MutationObserver(sync).observe(document.body, {
            attributes: true,
            attributeFilter: ["data-md-color-scheme"]
          });
        })();
      </script>
    </section>
  {% endif %}
{% endblock %}
